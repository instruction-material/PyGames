name: Core projects

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native game windows and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify course source inventory
        run: bash verify-course-source.sh
      - name: Install pinned native dependencies
        run: python -m pip install -r PG-CORE-Workspace-and-Assets/starter/requirements.txt
      - name: Validate untouched, completed, reference and regression profiles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python test/verify_core_projects.py --output output/core-projects
      - name: Validate Golf input, goals and bounded round resets
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python test/verify_golf.py --output output/core-projects/golf
      - name: Verify light and sound across repeated contact
        run: python test/verify_light_control.py --output output/core-projects/light-control
      - name: Validate the editable Light Control starter and reference
        run: |
          if python PG-CORE-Light-Control/starter/contracts.py > starter-contract.log 2>&1; then
            echo "The untouched starter passed its learner contract."
            exit 1
          fi
          cat starter-contract.log
          grep -Fx "AssertionError: (True, False, 'on', None)" starter-contract.log
          python PG-CORE-Light-Control/solution/contracts.py
          python test/verify_light_control.py --program PG-CORE-Light-Control/starter/main.py --starter --output output/core-projects/light-control-starter
          python test/verify_light_control.py --program PG-CORE-Light-Control/solution/main.py --output output/core-projects/light-control-solution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-core-projects
          path: output/core-projects
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
